name: sinbas-return
services:
  sinbas-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinbas
      POSTGRES_PASSWORD: sinbas
      POSTGRES_DB: sinbas
    volumes:
      - sinbas-pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:z
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sinbas -d sinbas" ]
      interval: 5s
      timeout: 5s
      retries: 5

  sinbas-api:
    # Imagen base pre-construida: base/build-dotnet-base.sh 1.0.1
    image: sinbas/dotnet10-solid-dev:latest
    depends_on:
      sinbas-db:
        condition: service_healthy
    volumes:
      - .:/workspace:cached,Z
    ports:
      - "8080:8080"
      - "5173:5173"
    command: sleep infinity
    user: dev
    userns_mode: keep-id
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DATABASE_URL: "Host=sinbas-db;Database=sinbas;Username=sinbas;Password=sinbas"

volumes:
  sinbas-pgdata:
