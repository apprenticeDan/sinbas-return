services:
  sinbas-db:
    image: postgres:16
    environment:
      POSTGRES_USER: sinbas
      POSTGRES_PASSWORD: sinbas
      POSTGRES_DB: sinbas
    volumes:
      - sinbas-pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinbas -d sinbas"]
      interval: 5s
      timeout: 5s
      retries: 5

  sinbas-api:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      sinbas-db:
        condition: service_healthy
    volumes:
      - .:/workspace:Z
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    stdin_open: true
    tty: true

volumes:
  sinbas-pgdata: